# ==============================================================================
# GitHub Pages 自动构建与发布工作流
# 当推送 v* 版本标签或手动触发时，自动执行单元测试、构建静态产物并部署到 GitHub Pages
# ==============================================================================
# ！todo：
# 在 GitHub 仓库开启 Pages（关键步骤）
# 打开仓库设置页面：https://github.com/teatang/candy-tool/settings/pages
# 在 Build and deployment -> Source 下拉框中，选择 GitHub Actions（不要选 Deploy from a branch）。
# 确认保存后，重新运行刚才失败的 Workflow（或再次推送 tag / 手动触发 Deploy to GitHub Pages）即可正常部署。
# ==============================================================================

name: Deploy to GitHub Pages

on:
  push:
    # 仅在推送以 v 开头的版本标签（如 v1.0.0）时触发发布
    tags:
      - 'v*'
  # 支持在 GitHub Actions 页面手动点击 "Run workflow" 触发
  workflow_dispatch:

# 配置 GitHub Actions Token 最小必要权限
permissions:
  # 读取仓库源码权限
  contents: read
  # 发布 GitHub Pages 站点权限
  pages: write
  # 生成 OIDC 身份令牌，用于 GitHub Pages 官方安全认证
  id-token: write

# 并发控制：同一时间仅允许一个 Pages 部署任务运行，避免旧构建覆盖新发布
concurrency:
  group: 'pages'
  # 不取消正在进行中的部署，确保线上站点发布过程原子完整
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # 任务 1：安装依赖、执行单元测试并构建前端静态产物
  # ----------------------------------------------------------------------------
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        # 使用 v6 原生支持 Node.js 24 运行时
        uses: actions/checkout@v6

      - name: 安装 pnpm 包管理器
        # 使用 v5 原生支持 Node.js 24 运行时，避免 Node 20 弃用警告
        uses: pnpm/action-setup@v5
        with:
          # 与本地 pnpm-lock.yaml 保持主版本一致
          version: 10

      - name: 安装 Node.js 并启用 pnpm 依赖缓存
        # 使用 v6 原生支持 Node.js 24 运行时
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 严格按锁文件安装依赖
        run: pnpm install --frozen-lockfile

      - name: 执行 Vitest 单元测试
        run: pnpm test

      - name: 配置 GitHub Pages 站点信息
        # 使用 v6 原生支持 Node.js 24 运行时；会自动校验 Pages 状态并输出部署路径 base_path
        id: pages
        uses: actions/configure-pages@v6

      - name: 类型检查与生产构建
        run: pnpm build
        env:
          # 优先使用 configure-pages 输出的 base_path（兼容自定义域名与 github.io/candy-tool 子路径）
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: 生成 SPA 路由 404 回退页
        # GitHub Pages 不支持 Nginx try_files，复制 index.html 为 404.html 以支持前端 History 路由刷新
        run: cp dist/index.html dist/404.html

      - name: 上传 GitHub Pages 构建产物
        # 使用 v4 原生支持 Node.js 24 运行时
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # ----------------------------------------------------------------------------
  # 任务 2：将构建产物正式发布至 GitHub Pages 环境
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to Pages
    # 必须等待 build 任务完全成功后才执行部署
    needs: build
    runs-on: ubuntu-latest

    # 声明部署目标环境，并在工作流详情页直接展示访问链接
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 部署静态站点到 GitHub Pages
        id: deployment
        # 使用 v5 原生支持 Node.js 24 运行时
        uses: actions/deploy-pages@v5
